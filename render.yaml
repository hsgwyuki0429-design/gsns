services:
  - type: web
    name: gsns
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set these three in the Render dashboard (Environment tab):
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
    # With Supabase holding all data (Postgres + Storage), the free plan's
    # ephemeral disk doesn't matter — restarts lose nothing.
