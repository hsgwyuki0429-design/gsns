<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Star Catcher</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1026;touch-action:none}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=0,H=0;
  function fit(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  addEventListener('resize',fit);fit();
  /* --- tiny synth SFX (WebAudio, inline, no Math.random) --- */
  var AC=null;
  function ac(){
    if(!AC)try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
    return AC;
  }
  addEventListener('pointerdown',function(){var c=ac();if(c&&c.state==='suspended')c.resume().catch(function(){});},true);
  function sfx(f,d,type,v,f2,at){
    var c=ac();if(!c)return;
    function play(){
      var t0=c.currentTime+(at||0),o=c.createOscillator(),g=c.createGain();
      o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
      if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
      g.gain.setValueAtTime(v||0.12,t0);
      g.gain.exponentialRampToValueAtTime(0.0008,t0+d);
      o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d+0.03);
    }
    if(c.state==='running')play();
    else c.resume().then(play).catch(function(){});
  }
  function jingle(){sfx(523,0.14,'sine',0.13);sfx(659,0.14,'sine',0.13,0,0.11);sfx(784,0.22,'sine',0.13,0,0.22);}
  function crash(){sfx(280,0.45,'sawtooth',0.15,70);}
  var DUR=30000,STEP=1000/120;
  var items=[],score=0,over=false,bx=0.5,nextDrop=500,acc=0,prev=-1,sim=0,flash=0;
  function onPoint(e){bx=Math.min(1,Math.max(0,e.clientX/W));}
  addEventListener('pointerdown',onPoint);
  addEventListener('pointermove',onPoint);
  function tick(){
    sim+=STEP;
    if(sim>=nextDrop&&sim<DUR-600){
      items.push({
        x:0.08+0.84*Math.random(),
        y:-0.05,
        v:(0.00030+0.00016*Math.random())*(1+sim/45000),
        bad:Math.random()<0.22,
        spin:Math.random()*7
      });
      nextDrop+=Math.max(260,560-sim/90);
    }
    var bw=0.13,by=0.86;
    for(var i=items.length-1;i>=0;i--){
      var it=items[i];
      it.y+=it.v*STEP;
      if(it.y>=by-0.02&&it.y<=by+0.05&&Math.abs(it.x-bx)<bw*0.5+0.035){
        if(it.bad){score=Math.max(0,score-3);flash=sim;sfx(140,0.28,'sawtooth',0.15,70);}
        else{score++;sfx(940,0.09,'sine',0.14,1500);}
        items.splice(i,1);continue;
      }
      if(it.y>1.1)items.splice(i,1);
    }
  }
  function draw(t){
    if(prev<0)prev=t;
    acc+=t-prev;prev=t;
    while(acc>=STEP&&!over){
      tick();acc-=STEP;
      if(sim>=DUR){over=true;jingle();try{parent.postMessage({gsns:'game-over'},'*');}catch(e){}}
    }
    ctx.clearRect(0,0,W,H);
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#141a3d');g.addColorStop(1,'#070a18');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    if(flash&&sim-flash<250){
      ctx.fillStyle='rgba(255,60,60,'+(0.35*(1-(sim-flash)/250))+')';
      ctx.fillRect(0,0,W,H);
    }
    // items
    for(var i=0;i<items.length;i++){
      var it=items[i],x=it.x*W,y=it.y*H,r=Math.min(W,H)*0.032+10;
      if(it.bad){
        ctx.fillStyle='#e04455';
        ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
        ctx.fillStyle='#fff';
        ctx.font='700 '+(r*1.1|0)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('✕',x,y+1);
      }else{
        ctx.save();ctx.translate(x,y);ctx.rotate(it.spin+it.y*4);
        ctx.fillStyle='#ffd94a';
        ctx.beginPath();
        for(var k=0;k<10;k++){
          var rr=k%2?r*0.45:r,a=Math.PI/5*k-Math.PI/2;
          ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
        }
        ctx.closePath();ctx.fill();
        ctx.restore();
      }
    }
    ctx.textBaseline='alphabetic';
    // basket
    var bw=0.13*W,bxp=bx*W,byp=0.86*H;
    ctx.fillStyle='#7a4de8';
    ctx.beginPath();
    ctx.moveTo(bxp-bw*0.5,byp);ctx.lineTo(bxp+bw*0.5,byp);
    ctx.lineTo(bxp+bw*0.36,byp+bw*0.42);ctx.lineTo(bxp-bw*0.36,byp+bw*0.42);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#b79cff';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(bxp-bw*0.5,byp);ctx.lineTo(bxp+bw*0.5,byp);ctx.stroke();
    // HUD
    ctx.fillStyle='#fff';ctx.textAlign='left';
    ctx.font='700 22px system-ui';ctx.fillText('SCORE '+score,16,86);
    var left=Math.max(0,(DUR-sim)/1000);
    ctx.textAlign='right';ctx.fillText(left.toFixed(1)+'s',W-16,86);
    if(over){
      ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);
      ctx.textAlign='center';
      ctx.font='800 54px system-ui';
      ctx.fillStyle='#fff';ctx.fillText('SCORE',W/2,H/2-40);
      ctx.font='800 96px system-ui';
      ctx.fillStyle='#ffd94a';ctx.fillText(score,W/2,H/2+62);
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
