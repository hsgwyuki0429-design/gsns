<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Reflex Rush</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1c0f12;touch-action:none}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=0,H=0;
  function fit(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  addEventListener('resize',fit);fit();
  var ROUNDS=5,PENALTY=1000;
  // all randomness consumed at load time → replay-safe RNG stream
  var DELAYS=[];
  for(var i=0;i<ROUNDS;i++)DELAYS.push(900+2100*Math.random());
  // phase: 'wait' (red), 'go' (green), 'result', 'done'
  var round=0,phase='result',phaseT=0,goAt=0,times=[],lastMs=0,lastEarly=false;
  function startRound(t){
    round++;phase='wait';phaseT=t;
    goAt=t+DELAYS[round-1];
  }
  // called with frame time from draw() and event time from the tap handler,
  // so a tap right after the light turns green is judged by its own
  // timestamp — not by whether a frame happened to render first
  function advance(t){
    if(phase==='result'&&t-phaseT>=(round===0?400:1100)){
      if(round>=ROUNDS){
        phase='done';
        try{parent.postMessage({gsns:'game-over'},'*');}catch(e){}
      }
      else startRound(t);
    }
    if(phase==='wait'&&t>=goAt)phase='go';
  }
  addEventListener('pointerdown',function(){
    var t=performance.now();
    advance(t);
    if(phase==='wait'){
      lastMs=PENALTY;lastEarly=true;times.push(PENALTY);
      phase='result';phaseT=t;
    }else if(phase==='go'){
      lastMs=Math.max(0,Math.round(t-goAt));lastEarly=false;times.push(lastMs);
      phase='result';phaseT=t;
    }
  });
  function draw(t){
    advance(t);
    var col=phase==='go'?'#1f9d55':(phase==='wait'?'#b3202f':'#241318');
    ctx.fillStyle=col;ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';
    if(phase==='wait'){
      ctx.font='800 44px system-ui';
      ctx.fillText('WAIT…',W/2,H/2-10);
      ctx.font='600 22px system-ui';ctx.globalAlpha=0.8;
      ctx.fillText('tap when GREEN',W/2,H/2+36);ctx.globalAlpha=1;
    }else if(phase==='go'){
      ctx.font='800 64px system-ui';
      ctx.fillText('TAP!',W/2,H/2+10);
    }else if(phase==='result'&&round>0){
      ctx.font='800 72px system-ui';
      ctx.fillStyle=lastEarly?'#ff7b7b':'#7bffb0';
      ctx.fillText(lastEarly?'TOO SOON':lastMs+'ms',W/2,H/2+10);
    }else if(phase==='done'){
      var sum=0;for(var i=0;i<times.length;i++)sum+=times[i];
      var avg=Math.round(sum/times.length);
      ctx.font='800 40px system-ui';
      ctx.fillText('AVERAGE',W/2,H/2-56);
      ctx.font='800 88px system-ui';
      ctx.fillStyle='#7bffb0';ctx.fillText(avg+'ms',W/2,H/2+40);
      ctx.font='600 22px system-ui';ctx.fillStyle='#fff';ctx.globalAlpha=0.8;
      ctx.fillText(times.join(' / '),W/2,H/2+96);ctx.globalAlpha=1;
    }
    // HUD
    ctx.textAlign='left';ctx.fillStyle='#fff';
    ctx.font='700 22px system-ui';
    ctx.fillText('ROUND '+Math.min(round,ROUNDS)+'/'+ROUNDS,16,86);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
